version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pecker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pecker
      POSTGRES_PASSWORD: pecker_dev
      POSTGRES_DB: pecker_chess
    ports:
      - "5433:5432"
    volumes:
      - pecker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pecker -d pecker_chess"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pecker_pgdata:
